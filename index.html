        function applyTextEffect(tag) {
            const input = document.getElementById('msgInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            if (start === end) {
                showSnackbar('请先选中输入框中的文字');
                return;
            }
            const selected = input.value.substring(start, end);
            const wrapped = `<${tag}>${selected}</${tag}>`;
            input.setRangeText(wrapped, start, end, 'end');
            autoResize(input);
            toggleSendBtn();
            const newPos = start + wrapped.length;
            input.setSelectionRange(newPos, newPos);
        }

        // ===================== 语音 =====================
        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const timer = document.getElementById('recordTimer');
            const hint = document.getElementById('recordHint');
            const stopBtn = document.getElementById('recordStopBtn');
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunks = [];
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
                    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = async () => {
                        stream.getTracks().forEach(t => t.stop());
                        const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
                        if (audioBlob.size < 1000) { showSnackbar('录音太短');
                            resetRecordingUI(); return; }
                        await uploadAudio(audioBlob, mimeType || 'audio/webm');
                        resetRecordingUI();
                    };
                    mediaRecorder.start();
                    recordStartTime = Date.now();
                    btn.classList.add('recording');
                    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
                    hint.textContent = '正在录音...';
                    stopBtn.classList.add('show');
                    recordTimerInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
                        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                        const secs = String(elapsed % 60).padStart(2, '0');
                        timer.textContent = `${mins}:${secs}`;
                    }, 1000);
                } catch (e) {
                    showSnackbar('无法访问麦克风');
                }
            } else if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        function resetRecordingUI() {
            const btn = document.getElementById('recordBtn');
            const timer = document.getElementById('recordTimer');
            const hint = document.getElementById('recordHint');
            const stopBtn = document.getElementById('recordStopBtn');
            btn.classList.remove('recording');
            btn.innerHTML =
                '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>';
            timer.textContent = '00:00';
            hint.textContent = '点击按钮开始录音';
            stopBtn.classList.remove('show');
            if (recordTimerInterval) { clearInterval(recordTimerInterval);
                recordTimerInterval = null; }
        }

        async function uploadAudio(blob, mimeType) {
            const ext = mimeType.includes('webm') ? 'webm' : 'm4a';
            const filePath = `audio/${Date.now()}-${generateId()}.${ext}`;
            showSnackbar('正在上传语音...');
            try {
                const { error } = await sb.storage.from(STORAGE_BUCKET).upload(filePath, blob, { contentType: mimeType,
                    cacheControl: '3600' });
                if (error) {
                    if (error.message.includes('bucket') || error.message.includes('not found')) showSnackbar(
                        '上传失败: 请先在 Storage 创建 chat-images Bucket');
                    else showSnackbar('上传失败: ' + error.message);
                    return;
                }
                const { data: urlData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
                const duration = recordStartTime ? Math.floor((Date.now() - recordStartTime) / 1000) : 0;
                const fallbackText = buildVoiceFallback(duration);
                let result = await safeInsertMsg({ sender: currentUser, text: fallbackText, audio_url: urlData
                        .publicUrl, audio_dur: duration });
                if (result.error && result.error.message && (result.error.message.includes('audio_dur') || result
                        .error.message.includes('audio_url'))) {
                    const fallbackWithUrl = buildVoiceFallback(duration, urlData.publicUrl);
                    result = await safeInsertMsg({ sender: currentUser, text: fallbackWithUrl });
                }
                if (result.error) showSnackbar('发送语音失败: ' + result.error.message);
                else showSnackbar('语音已发送');
            } catch (e) { showSnackbar('上传失败'); }
        }

        function buildVoiceFallback(duration, audioUrl) {
            const mins = String(Math.floor(duration / 60)).padStart(2, '0');
            const secs = String(duration % 60).padStart(2, '0');
            var tail = audioUrl || '未知';
            return EMOJI_VOICE + ' 语音消息 ' + mins + ':' + secs + SEP + tail;
        }

        function toggleVoicePlay(wrap, event) {
            event.stopPropagation();
            const audioUrl = wrap.dataset.audio;
            if (!audioUrl) return;

            if (activeAudio && activeAudio.wrap === wrap && !activeAudio.audio.paused) {
                activeAudio.audio.pause();
                wrap.classList.remove('playing');
                const btn = wrap.querySelector('.voice-play-btn');
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
                activeAudio = null;
                return;
            }

            if (activeAudio) {
                activeAudio.audio.pause();
                activeAudio.wrap.classList.remove('playing');
                const prevBtn = activeAudio.wrap.querySelector('.voice-play-btn');
                prevBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
            }

            const audio = new Audio(audioUrl);
            wrap.classList.add('playing');
            const btn = wrap.querySelector('.voice-play-btn');
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

            audio.onended = () => {
                wrap.classList.remove('playing');
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
                if (activeAudio && activeAudio.wrap === wrap) activeAudio = null;
            };
            audio.onerror = () => {
                wrap.classList.remove('playing');
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
                if (activeAudio && activeAudio.wrap === wrap) activeAudio = null;
                showSnackbar('播放失败');
            };
            audio.play().catch(() => {
                wrap.classList.remove('playing');
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
                showSnackbar('播放失败');
            });
            activeAudio = { audio, wrap };
        }

        // ===================== 交互：头像单击弹出个人信息，长按@，双击拍一拍 =====================
        function initInteractions() {
            const messagesEl = document.getElementById('messagesEl');

            messagesEl.addEventListener('contextmenu', (e) => {
                if (!e.target.closest('.msg-input')) e.preventDefault();
            });

            let pressTimer = null;
            let pressStartX = 0,
                pressStartY = 0;
            let pressMoved = false;
            let pressTargetRow = null;

            const startPress = (e) => {
                const target = e.target;
                if (target.closest('.msg-input')) return;
                const bubble = target.closest('.bubble');
                if (!bubble) return;
                if (target.closest('img')) return;
                const row = bubble.closest('.msg-row');
                if (!row) return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                pressStartX = cx;
                pressStartY = cy;
                pressMoved = false;
                pressTargetRow = row;
                pressTimer = setTimeout(() => {
                    if (!pressMoved && pressTargetRow) {
                        showContextMenuForRow(pressTargetRow, pressStartX, pressStartY);
                        pressTargetRow = null;
                    }
                }, 500);
            };
            const movePress = (e) => {
                if (!pressTimer) return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                if (Math.abs(cx - pressStartX) > 10 || Math.abs(cy - pressStartY) > 10) {
                    pressMoved = true;
                    clearTimeout(pressTimer);
                    pressTimer = null;
                    pressTargetRow = null;
                }
            };
            const endPress = () => {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                    pressTargetRow = null;
                }
            };
            messagesEl.addEventListener('touchstart', startPress, { passive: true });
            messagesEl.addEventListener('touchmove', movePress, { passive: true });
            messagesEl.addEventListener('touchend', endPress);
            messagesEl.addEventListener('touchcancel', endPress);
            messagesEl.addEventListener('mousedown', (e) => { if (e.button === 0) startPress(e); });
            document.addEventListener('mousemove', (e) => { if (pressTimer && e.button === 0) movePress(e); });
            document.addEventListener('mouseup', (e) => { if (e.button === 0) endPress(); });
            messagesEl.addEventListener('contextmenu', (e) => {
                const target = e.target;
                if (target.closest('.msg-input')) return;
                const bubble = target.closest('.bubble');
                if (!bubble) return;
                if (target.closest('img')) return;
                const row = bubble.closest('.msg-row');
                if (row) { e.preventDefault();
                    showContextMenuForRow(row, e.clientX, e.clientY); }
            });

            // 头像交互
            let avatarPressTimer = null;
            let avatarMoved = false;
            let avatarStartX = 0,
                avatarStartY = 0;
            let avatarTarget = null;
            messagesEl.addEventListener('pointerdown', (e) => {
                const avatar = e.target.closest('.avatar');
                if (!avatar) return;
                const sender = avatar.dataset.sender;
                if (!sender) return;
                avatarTarget = avatar;
                const cx = e.clientX,
                    cy = e.clientY;
                avatarStartX = cx;
                avatarStartY = cy;
                avatarMoved = false;
                avatarPressTimer = setTimeout(() => {
                    if (!avatarMoved && avatarTarget) {
                        const sender = avatarTarget.dataset.sender;
                        if (sender && sender !== currentUser) {
                            insertAtMention(sender);
                        }
                        avatarTarget = null;
                    }
                }, 500);
            });
            document.addEventListener('pointermove', (e) => {
                if (!avatarPressTimer) return;
                const cx = e.clientX,
                    cy = e.clientY;
                if (Math.abs(cx - avatarStartX) > 10 || Math.abs(cy - avatarStartY) > 10) {
                    avatarMoved = true;
                    clearTimeout(avatarPressTimer);
                    avatarPressTimer = null;
                    avatarTarget = null;
                }
            });
            document.addEventListener('pointerup', (e) => {
                if (avatarPressTimer) {
                    clearTimeout(avatarPressTimer);
                    avatarPressTimer = null;
                    if (!avatarMoved && avatarTarget) {
                        const sender = avatarTarget.dataset.sender;
                        if (sender) {
                            showProfileModal(sender);
                        }
                    }
                    avatarTarget = null;
                }
            });

            messagesEl.addEventListener('dblclick', (e) => {
                const avatar = e.target.closest('.avatar');
                if (!avatar) return;
                const sender = avatar.dataset.sender;
                if (!sender || sender === currentUser) return;
                const now = Date.now();
                if (now - lastPokeTime < 60000) {
                    showSnackbar('拍一拍冷却中，请稍后再试');
                    return;
                }
                lastPokeTime = now;
                addSystemMsg(`你拍了拍 ${sender}`);
            });
        }

        function insertAtMention(sender) {
            const input = document.getElementById('msgInput');
            const atText = `@${sender} `;
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value = input.value.substring(0, start) + atText + input.value.substring(end);
            input.focus();
            const newPos = start + atText.length;
            input.setSelectionRange(newPos, newPos);
            autoResize(input);
            toggleSendBtn();
        }

        async function banUser() {
            const btn = document.getElementById('profileBanBtn');
            const username = btn.dataset.username;
            const currentlyBanned = btn.dataset.banned === 'true';
            const newState = !currentlyBanned;
            if (!confirm(`确定要${newState?'封禁':'解封'}用户 ${username} 吗？`)) return;

            try {
                const { error } = await sb.from(TABLE_USERS).update({ banned: newState }).eq('username', username);
                if (error) { showSnackbar('操作失败: ' + error.message); return; }
                showSnackbar(`用户 ${username} 已${newState?'封禁':'解封'}`);
                if (newState && username === currentUser) {
                    showSnackbar('您已被封禁，即将下线');
                    setTimeout(() => logout(), 1000);
                }
                if (newState) {
                    channel.send({ type: 'broadcast', event: 'user_banned', payload: { username } });
                }
                showProfileModal(username);
            } catch (e) { showSnackbar('操作失败'); }
        }

        // ===================== 右键菜单 =====================
        function showContextMenuForRow(row, x, y) {
            closeContextMenu();
            const menu = document.getElementById('msgContextMenu');
            menu.innerHTML = '';

            const msgId = row.dataset.msgId;
            const sender = row.dataset.msgSender;
            const text = row.dataset.msgText || '';
            const version = row.dataset.msgVersion || '';
            const type = row.dataset.msgType || 'text';
            const linkUrl = row.dataset.linkUrl || '';
            const imageUrl = row.dataset.imageUrl || '';
            const replyToId = row.dataset.replyToId || '';
            const replyContent = row.dataset.replyContent || '';

            contextTarget = { row, msgId, sender, text, version, type, linkUrl, imageUrl, replyToId, replyContent };

            const isOwn = sender === currentUser;
            const canDelete = isOwn || isAdmin;

            const icons = {
                save: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>',
                open: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>',
                copy: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>',
                delete: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
                reply: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>'
            };

            const addItem = (label, iconSvg, action) => {
                const item = document.createElement('div');
                item.className = 'menu-item';
                item.innerHTML = iconSvg + ' ' + label;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    action();
                    closeContextMenu();
                });
                menu.appendChild(item);
            };

            const replyContentText = text || '图片/语音/文件';
            addItem('回复', icons.reply, () => {
                setReplyTarget(msgId, sender, replyContentText);
            });

            if (type === 'image') {
                addItem('保存图片', icons.save, () => {
                    const url = imageUrl;
                    if (url) {
                        fetch(url).then(res => res.blob()).then(blob => {
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = 'image.jpg';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(a.href);
                        }).catch(() => showSnackbar('保存失败'));
                    } else {
                        showSnackbar('图片地址无效');
                    }
                });
                if (canDelete) addItem('删除', icons.delete, () => contextDeleteMsg());
            } else if (type === 'link' || type === 'file') {
                if (linkUrl) {
                    addItem('在浏览器中打开', icons.open, () => window.open(linkUrl, '_blank'));
                }
                const copyText = text || linkUrl;
                if (copyText) {
                    addItem('复制文字', icons.copy, () => {
                        navigator.clipboard.writeText(copyText).then(() => showSnackbar('已复制'))
                            .catch(() => {
                                const ta = document.createElement('textarea');
                                ta.value = copyText;
                                ta.style.position = 'fixed';
                                ta.style.opacity = '0';
                                document.body.appendChild(ta);
                                ta.select();
                                document.execCommand('copy');
                                document.body.removeChild(ta);
                                showSnackbar('已复制');
                            });
                    });
                }
                if (canDelete) addItem('删除', icons.delete, () => contextDeleteMsg());
            } else if (type === 'text') {
                if (text) {
                    addItem('复制文字', icons.copy, () => {
                        navigator.clipboard.writeText(text).then(() => showSnackbar('已复制'))
                            .catch(() => {
                                const ta = document.createElement('textarea');
                                ta.value = text;
                                ta.style.position = 'fixed';
                                ta.style.opacity = '0';
                                document.body.appendChild(ta);
                                ta.select();
                                document.execCommand('copy');
                                document.body.removeChild(ta);
                                showSnackbar('已复制');
                            });
                    });
                }
                if (canDelete) addItem('删除', icons.delete, () => contextDeleteMsg());
            } else {
                if (canDelete) addItem('删除', icons.delete, () => contextDeleteMsg());
            }

            if (menu.children.length === 0) return;

            menu.classList.add('show');
            let left = x,
                top = y;
            const menuW = menu.offsetWidth || 160;
            const menuH = menu.offsetHeight || 80;
            if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
            if (top + menuH > window.innerHeight - 8) top = window.innerHeight - menuH - 8;
            if (left < 8) left = 8;
            if (top < 8) top = 8;
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
        }

        function closeContextMenu() {
            const menu = document.getElementById('msgContextMenu');
            menu.classList.remove('show');
            menu.innerHTML = '';
            contextTarget = null;
        }

        async function contextDeleteMsg() {
            if (!contextTarget) return;
            const msgId = contextTarget.msgId;
            if (!msgId) { showSnackbar('无效消息'); return; }
            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            if (!uuidRegex.test(msgId)) { showSnackbar('无效的消息ID'); return; }
            try {
                const { error } = await sb.from(TABLE_MSG).delete().eq('id', msgId);
                if (error) { showSnackbar('删除失败: ' + error.message); return; }
                channel.send({ type: 'broadcast', event: 'delete_message', payload: { id: msgId } });
                handleMessageDeleted(msgId);
                showSnackbar('消息已删除');
            } catch (e) { showSnackbar('删除失败'); }
            closeContextMenu();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.msg-context-menu') && !e.target.closest('.bubble')) {
                closeContextMenu();
            }
        });

        // ===================== 初始化 =====================
        function init() {
            sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            clientId = generateId();
            initEmojiPicker();
            initRipple();
            initInteractions();
            showGlobalLoading('登录中…', '正在验证身份');
            restoreSession();
        }

        function restoreSession() {
            const saved = localStorage.getItem('mjchat_session');
            if (saved) {
                try {
                    const session = JSON.parse(saved);
                    sb.from(TABLE_USERS).select('username, banned, role').eq('username', session.username)
                        .maybeSingle()
                        .then(({ data }) => {
                            if (data && !isEntered) {
                                if (data.banned) {
                                    localStorage.removeItem('mjchat_session');
                                    hideGlobalLoading();
                                    showLogin();
                                    showEl('loginError', '您已被封禁');
                                    return;
                                }
                                currentUser = session.username;
                                isAdmin = (data.role === 'admin') || ADMIN_USERS.includes(currentUser);
                                updateLoadingText('登录中…', '欢迎回来 ' + currentUser);
                                enterChat();
                            } else {
                                if (!data) localStorage.removeItem('mjchat_session');
                                hideGlobalLoading();
                                showLogin();
                            }
                        })
                        .catch(() => {
                            localStorage.removeItem('mjchat_session');
                            hideGlobalLoading();
                            showLogin();
                        });
                } catch (e) {
                    localStorage.removeItem('mjchat_session');
                    hideGlobalLoading();
                    showLogin();
                }
            } else {
                hideGlobalLoading();
                showLogin();
            }
        }

        function initRipple() {
            document.querySelectorAll('.ripple').forEach(el => {
                el.addEventListener('click', function(e) {
                    const r = this.getBoundingClientRect(),
                        s = Math.max(r.width, r.height),
                        x = e.clientX - r.left - s / 2,
                        y = e.clientY - r.top - s / 2;
                    const rip = document.createElement('span');
                    rip.className = 'ripple-effect';
                    rip.style.width = rip.style.height = s + 'px';
                    rip.style.left = x + 'px';
                    rip.style.top = y + 'px';
                    this.appendChild(rip);
                    setTimeout(() => rip.remove(), 600);
                });
            });
        }
