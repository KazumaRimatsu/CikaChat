<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MJChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 样式（完整保留） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --md-primary: #4A9EFF;
            --md-primary-variant: #1565C0;
            --md-secondary: #03DAC6;
            --md-background: #121212;
            --md-surface: #1E1E1E;
            --md-surface-1dp: #1E1E1E;
            --md-surface-2dp: #232323;
            --md-surface-3dp: #252525;
            --md-surface-4dp: #272727;
            --md-surface-6dp: #2C2C2C;
            --md-surface-8dp: #2E2E2E;
            --md-surface-12dp: #313131;
            --md-surface-16dp: #333333;
            --md-error: #CF6679;
            --md-on-primary: #FFFFFF;
            --md-on-background: #FFFFFF;
            --md-on-surface: #FFFFFF;
            --md-on-surface-muted: rgba(255, 255, 255, 0.60);
            --md-on-surface-dim: rgba(255, 255, 255, 0.38);
            --md-outline: rgba(255, 255, 255, 0.12);
            --md-ripple: rgba(255, 255, 255, 0.08);
            --md-success: #81C784;
            --md-elevation-1: 0 1px 2px 0 rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
            --md-elevation-2: 0 1px 2px 0 rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
            --md-elevation-4: 0 2px 3px 0 rgba(0, 0, 0, 0.3), 0 6px 10px 4px rgba(0, 0, 0, 0.15);
            --md-elevation-8: 0 4px 5px 0 rgba(0, 0, 0, 0.3), 0 12px 21px 8px rgba(0, 0, 0, 0.15);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
        }
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--md-background);
            color: var(--md-on-background);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-weight: 400;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .app {
            width: 100%;
            max-width: 480px;
            height: 92vh;
            background: var(--md-surface);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: var(--md-elevation-8);
        }
        .global-loading {
            position: absolute;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--md-surface);
            gap: 20px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            border-radius: var(--radius-lg);
        }
        .global-loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .global-loading .md-progress {
            width: 40px;
            height: 40px;
            border: 3px solid var(--md-surface-6dp);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: md-spin 0.8s linear infinite;
        }
        .global-loading .loading-text {
            font-size: 1rem;
            color: var(--md-on-surface-muted);
            letter-spacing: 0.3px;
        }
        .global-loading .loading-sub {
            font-size: 0.8125rem;
            color: var(--md-on-surface-dim);
            margin-top: -8px;
        }
        @keyframes md-spin {
            to {
                transform: rotate(360deg);
            }
        }
        .app-bar {
            display: flex;
            align-items: center;
            padding: 0 4px 0 8px;
            height: 56px;
            background: var(--md-surface-4dp);
            box-shadow: var(--md-elevation-2);
            z-index: 10;
            flex-shrink: 0;
        }
        .app-bar .title-block {
            flex: 1;
            margin-left: 8px;
        }
        .app-bar .title {
            font-size: 1.125rem;
            font-weight: 500;
        }
        .icon-button {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--md-on-surface);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .icon-button:active {
            background: var(--md-ripple);
        }
        .icon-button svg {
            width: 24px;
            height: 24px;
        }
        .online-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-right: 8px;
            padding: 4px 10px;
            background: rgba(129, 199, 132, 0.12);
            border-radius: 16px;
            font-size: 0.75rem;
            color: var(--md-success);
            font-weight: 500;
        }
        .online-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-success);
        }
        .conn-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-right: 4px;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            color: var(--md-on-surface-muted);
        }
        .conn-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--md-error);
            transition: all 0.3s;
        }
        .conn-indicator .dot.on {
            background: var(--md-success);
            box-shadow: 0 0 4px var(--md-success);
        }
        .user-menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            animation: fade-in 0.2s ease;
        }
        .user-menu-overlay.show {
            display: flex;
        }
        .user-menu-card {
            background: var(--md-surface-4dp);
            border-radius: var(--radius-lg);
            box-shadow: var(--md-elevation-8);
            padding: 20px 16px 12px;
            min-width: 200px;
            max-width: 280px;
            margin-top: 56px;
            animation: menu-slide 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes menu-slide {
            from {
                opacity: 0;
                transform: translateY(-12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .user-menu-card .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--md-outline);
        }
        .user-menu-card .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .user-menu-card .user-name {
            font-size: 1rem;
            font-weight: 500;
            color: var(--md-on-surface);
        }
        .user-menu-card .menu-list {
            margin-top: 8px;
            list-style: none;
        }
        .user-menu-card .menu-list li {
            padding: 10px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--md-on-surface-muted);
            font-size: 0.875rem;
            transition: background 0.15s;
        }
        .user-menu-card .menu-list li:hover {
            background: var(--md-ripple);
        }
        .user-menu-card .menu-list li:active {
            background: var(--md-surface-8dp);
        }
        .user-menu-card .menu-list li svg {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }
        .user-menu-card .menu-list li.admin-item {
            color: var(--md-primary);
        }
        .user-menu-card .menu-list li.logout-item {
            color: var(--md-error);
        }
        .users-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--md-surface-1dp);
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid var(--md-outline);
        }
        .users-strip::-webkit-scrollbar {
            display: none;
        }
        .users-strip .label {
            font-size: 0.75rem;
            color: var(--md-on-surface-dim);
            white-space: nowrap;
            margin-right: 4px;
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px 4px 6px;
            background: var(--md-surface-2dp);
            border-radius: 20px;
            font-size: 0.75rem;
            white-space: nowrap;
            color: var(--md-on-surface-muted);
        }
        .user-chip.me {
            background: rgba(74, 158, 255, 0.12);
            color: var(--md-primary);
        }
        .user-chip .av {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: var(--md-background);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .messages * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .msg-input {
            -webkit-user-select: text !important;
            user-select: text !important;
        }
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-thumb {
            background: var(--md-outline);
            border-radius: 2px;
        }
        .date-divider {
            text-align: center;
            margin: 16px 0 8px;
        }
        .date-divider span {
            font-size: 0.6875rem;
            color: var(--md-on-surface-dim);
            background: var(--md-surface-2dp);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }
        .msg-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            animation: md-enter 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes md-enter {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-row.own {
            flex-direction: row-reverse;
        }
        .msg-row .avatar {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 700;
            color: white;
            margin-top: 2px;
            cursor: pointer;
            position: relative;
        }
        .msg-row .content {
            max-width: 72%;
            display: flex;
            flex-direction: column;
        }
        .msg-row.own .content {
            align-items: flex-end;
        }
        .msg-row .meta {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 0 4px 2px;
        }
        .msg-row.own .meta {
            flex-direction: row-reverse;
        }
        .msg-row .sender {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--md-on-surface-muted);
        }
        .msg-row.own .sender {
            color: var(--md-primary);
        }
        .msg-row .time {
            font-size: 0.6875rem;
            color: var(--md-on-surface-dim);
        }
        .bubble {
            display: inline-block;
            padding: 10px 14px;
            font-size: 0.875rem;
            line-height: 1.43;
            word-wrap: break-word;
            position: relative;
            max-width: 100%;
            cursor: default;
        }
        .msg-row .bubble {
            background: var(--md-surface-2dp);
            border-radius: 4px 16px 16px 16px;
            color: var(--md-on-surface);
        }
        .msg-row.own .bubble {
            background: var(--md-primary);
            color: var(--md-on-primary);
            border-radius: 16px 4px 16px 16px;
        }
        .bubble img {
            max-width: 220px;
            max-height: 220px;
            border-radius: 8px;
            display: block;
            cursor: pointer;
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        .bubble .img-only {
            padding: 2px;
        }
        .bubble a {
            color: #64B5F6;
            text-decoration: underline;
        }
        .msg-row.own .bubble a {
            color: #FFFFFF;
            text-decoration: underline;
        }
        .bubble s {
            text-decoration: line-through;
        }
        .bubble .file-msg {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: inherit;
        }
        .bubble .file-msg svg {
            flex-shrink: 0;
            opacity: 0.8;
        }
        .bubble .file-msg .file-info b {
            display: block;
        }
        .bubble .file-msg .file-info .file-size {
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .voice-msg-wrap {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 16px;
            cursor: pointer;
            min-width: 130px;
            max-width: 240px;
            user-select: none;
            -webkit-user-select: none;
        }
        .msg-row .voice-msg-wrap {
            background: var(--md-surface-4dp);
        }
        .msg-row.own .voice-msg-wrap {
            background: rgba(255, 255, 255, 0.15);
        }
        .voice-msg-wrap .voice-play-btn {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            border: none;
            background: var(--md-primary);
            color: var(--md-on-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
        }
        .msg-row.own .voice-msg-wrap .voice-play-btn {
            background: var(--md-on-primary);
            color: var(--md-primary);
        }
        .voice-msg-wrap .voice-play-btn svg {
            width: 16px;
            height: 16px;
        }
        .voice-msg-wrap .voice-waves {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 28px;
        }
        .voice-msg-wrap .voice-wave {
            flex: 1;
            background: var(--md-primary);
            border-radius: 1.5px;
            min-width: 2px;
            transition: height 0.1s;
        }
        .msg-row.own .voice-msg-wrap .voice-wave {
            background: var(--md-on-primary);
        }
        .voice-msg-wrap .voice-dur {
            font-size: 0.75rem;
            color: var(--md-on-surface-muted);
            white-space: nowrap;
            min-width: 36px;
        }
        .msg-row.own .voice-msg-wrap .voice-dur {
            color: rgba(255, 255, 255, 0.7);
        }
        .voice-msg-wrap.playing .voice-wave {
            animation: voiceAnim 0.8s ease-in-out infinite alternate;
        }
        .voice-msg-wrap.playing .voice-wave:nth-child(2n) {
            animation-delay: 0.1s;
        }
        .voice-msg-wrap.playing .voice-wave:nth-child(3n) {
            animation-delay: 0.2s;
        }
        .voice-msg-wrap.playing .voice-wave:nth-child(4n) {
            animation-delay: 0.15s;
        }
        .voice-msg-wrap.playing .voice-wave:nth-child(5n) {
            animation-delay: 0.25s;
        }
        @keyframes voiceAnim {
            0% {
                height: 4px;
            }
            100% {
                height: 24px;
            }
        }
        .system-msg {
            display: flex;
            justify-content: center;
            margin: 8px 0;
        }
        .system-msg span {
            font-size: 0.75rem;
            color: var(--md-on-surface-dim);
            background: var(--md-surface-1dp);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--md-on-surface-dim);
            gap: 8px;
        }
        .empty-state svg {
            width: 56px;
            height: 56px;
            opacity: 0.3;
        }
        .empty-state p {
            font-size: 0.875rem;
        }
        .empty-state .sub {
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .loading-state {
            text-align: center;
            padding: 24px;
            color: var(--md-on-surface-dim);
            font-size: 0.8125rem;
        }
        .md-progress {
            width: 24px;
            height: 24px;
            border: 2.5px solid var(--md-surface-6dp);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: md-spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }
        .chat-bar {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 8px 12px 8px 8px;
            background: var(--md-surface-4dp);
            box-shadow: var(--md-elevation-2);
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }
        .more-btn {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border: none;
            border-radius: 50%;
            background: var(--md-surface-2dp);
            color: var(--md-on-surface-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 4px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .more-btn:hover {
            background: var(--md-surface-4dp);
        }
        .more-btn:active {
            background: var(--md-surface-6dp);
        }
        .more-btn svg {
            width: 24px;
            height: 24px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .more-btn.active {
            background: var(--md-primary);
            color: var(--md-on-primary);
        }
        .more-btn.active svg {
            transform: rotate(135deg);
        }
        .input-container {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: var(--md-surface-1dp);
            border-radius: 24px;
            padding: 0 4px 0 16px;
            min-height: 48px;
            transition: background 0.2s;
            position: relative;
        }
        .input-container:focus-within {
            background: var(--md-surface-2dp);
        }
        .msg-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--md-on-surface);
            font-size: 0.9375rem;
            font-family: inherit;
            outline: none;
            resize: none;
            padding: 14px 0;
            line-height: 1.4;
            max-height: 100px;
            min-height: 20px;
            -webkit-user-select: text !important;
            user-select: text !important;
        }
        .msg-input::placeholder {
            color: var(--md-on-surface-dim);
        }
        .fab-send {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border: none;
            border-radius: 50%;
            background: var(--md-primary);
            color: var(--md-on-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--md-elevation-2);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .fab-send:hover {
            box-shadow: var(--md-elevation-4);
            filter: brightness(1.08);
        }
        .fab-send:active {
            transform: scale(0.92);
        }
        .fab-send:disabled {
            background: var(--md-surface-6dp);
            color: var(--md-on-surface-dim);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .fab-send svg {
            width: 24px;
            height: 24px;
        }
        .feature-panel {
            background: var(--md-surface-2dp);
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }
        .feature-panel.show {
            max-height: 400px;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 20px 16px;
        }
        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .feature-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--md-surface-4dp);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            position: relative;
            overflow: hidden;
        }
        .feature-icon:active {
            background: var(--md-surface-6dp);
        }
        .feature-icon svg {
            width: 28px;
            height: 28px;
            color: var(--md-on-surface-muted);
        }
        .feature-label {
            font-size: 0.75rem;
            color: var(--md-on-surface-muted);
        }
        .sub-panel {
            display: none;
        }
        .sub-panel.active {
            display: flex;
            flex-direction: column;
            max-height: 360px;
        }
        .sub-panel-header {
            display: flex;
            align-items: center;
            padding: 12px 16px 4px;
            gap: 8px;
            flex-shrink: 0;
        }
        .sub-panel-back {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--md-on-surface-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sub-panel-back:hover {
            background: var(--md-ripple);
        }
        .sub-panel-back svg {
            width: 20px;
            height: 20px;
        }
        .sub-panel-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--md-on-surface-muted);
        }
        .emoji-scroll {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .emoji-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .emoji-scroll::-webkit-scrollbar-thumb {
            background: var(--md-outline);
            border-radius: 2px;
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            padding: 8px 16px 16px;
        }
        .emoji-item {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.25rem;
            padding: 6px;
            border-radius: var(--radius-sm);
            transition: background 0.12s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .emoji-item:hover {
            background: var(--md-ripple);
        }
        .text-effect-grid {
            display: flex;
            gap: 12px;
            padding: 16px;
            justify-content: center;
        }
        .effect-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--md-surface-4dp);
            color: var(--md-on-surface-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
            transition: background 0.15s, color 0.15s;
        }
        .effect-btn:hover {
            background: var(--md-surface-6dp);
        }
        .effect-btn:active {
            background: var(--md-surface-12dp);
        }
        .effect-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--md-on-surface-dim);
            padding: 0 16px 16px;
            line-height: 1.4;
        }
        .voice-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px 16px;
        }
        .record-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: var(--md-error);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .record-btn:hover {
            transform: scale(1.05);
        }
        .record-btn:active {
            transform: scale(0.95);
        }
        .record-btn.recording {
            background: var(--md-error);
            animation: pulse-rec 1.5s ease-in-out infinite;
        }
        @keyframes pulse-rec {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(207, 102, 121, 0.4);
            }
            50% {
                box-shadow: 0 0 0 16px rgba(207, 102, 121, 0);
            }
        }
        .record-btn svg {
            width: 32px;
            height: 32px;
        }
        .record-timer {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--md-on-surface);
            font-variant-numeric: tabular-nums;
        }
        .record-hint {
            font-size: 0.75rem;
            color: var(--md-on-surface-dim);
            text-align: center;
        }
        .record-stop-btn {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            background: var(--md-surface-4dp);
            color: var(--md-on-surface);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }
        .record-stop-btn.show {
            display: block;
        }
        .auth-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: var(--md-background);
            gap: 20px;
            overflow-y: auto;
            position: relative;
        }
        .auth-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--md-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-primary);
            box-shadow: var(--md-elevation-4);
            flex-shrink: 0;
        }
        .auth-icon svg {
            width: 32px;
            height: 32px;
        }
        .auth-screen h1 {
            font-size: 1.4rem;
            font-weight: 400;
        }
        .auth-form {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .md-text-field {
            position: relative;
        }
        .md-text-field input {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            background: var(--md-surface-1dp);
            border: 1px solid var(--md-outline);
            border-radius: var(--radius-md);
            color: var(--md-on-surface);
            font-size: 0.9375rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, padding 0.2s;
        }
        .md-text-field input:focus {
            border: 2px solid var(--md-primary);
            padding: 0 15px;
        }
        .md-text-field label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--md-on-surface-dim);
            font-size: 0.9375rem;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--md-background);
            padding: 0 4px;
        }
        .md-text-field input:focus+label,
        .md-text-field input:not(:placeholder-shown)+label {
            top: 0;
            font-size: 0.75rem;
            color: var(--md-primary);
        }
        .md-button {
            padding: 0 24px;
            height: 48px;
            border: none;
            border-radius: 24px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .md-button.contained {
            background: var(--md-primary);
            color: var(--md-on-primary);
            box-shadow: var(--md-elevation-2);
        }
        .md-button.contained:hover {
            box-shadow: var(--md-elevation-4);
            filter: brightness(1.08);
        }
        .md-button.contained:active {
            transform: scale(0.98);
        }
        .md-button.text {
            background: transparent;
            color: var(--md-primary);
        }
        .auth-switch {
            text-align: center;
            font-size: 0.8125rem;
            color: var(--md-on-surface-muted);
        }
        .auth-switch a {
            color: var(--md-primary);
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
        }
        .auth-error {
            background: rgba(207, 102, 121, 0.12);
            border: 1px solid var(--md-error);
            color: var(--md-error);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.8125rem;
            line-height: 1.4;
            display: none;
        }
        .auth-error.show {
            display: block;
        }
        .auth-success {
            background: rgba(129, 199, 132, 0.12);
            border: 1px solid var(--md-success);
            color: var(--md-success);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.8125rem;
            line-height: 1.4;
            display: none;
        }
        .auth-success.show {
            display: block;
        }
        .hidden {
            display: none !important;
        }
        .av-0 {
            background: #4A9EFF;
        }
        .av-1 {
            background: #BA68C8;
        }
        .av-2 {
            background: #4DB6AC;
        }
        .av-3 {
            background: #4FC3F7;
        }
        .av-4 {
            background: #FF8A65;
        }
        .av-5 {
            background: #A1887F;
        }
        .av-6 {
            background: #90A4AE;
        }
        .av-7 {
            background: #F06292;
        }
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            animation: ripple-anim 0.6s ease-out;
        }
        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fade-in 0.2s ease;
        }
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .md-dialog {
            background: var(--md-surface-4dp);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 320px;
            width: calc(100% - 48px);
            box-shadow: var(--md-elevation-8);
            animation: dialog-enter 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes dialog-enter {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .md-dialog h2 {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .md-dialog p {
            font-size: 0.875rem;
            color: var(--md-on-surface-muted);
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .md-dialog .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .snackbar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--md-surface-8dp);
            color: var(--md-on-surface);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            box-shadow: var(--md-elevation-4);
            z-index: 200;
            animation: snackbar-in 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90vw;
        }
        @keyframes snackbar-in {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .image-preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            cursor: pointer;
        }
        .image-preview-overlay img {
            max-width: 95vw;
            max-height: 95vh;
            border-radius: 8px;
        }
        .msg-context-menu {
            position: fixed;
            background: var(--md-surface-6dp);
            border-radius: var(--radius-md);
            padding: 4px 0;
            box-shadow: var(--md-elevation-8);
            z-index: 500;
            min-width: 140px;
            display: none;
            overflow: hidden;
        }
        .msg-context-menu.show {
            display: block;
            animation: menu-enter 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes menu-enter {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .msg-context-menu .menu-item {
            padding: 10px 16px;
            font-size: 0.875rem;
            color: var(--md-on-surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.1s;
        }
        .msg-context-menu .menu-item:hover {
            background: var(--md-ripple);
        }
        .msg-context-menu .menu-item:active {
            background: var(--md-ripple);
        }
        .msg-context-menu .menu-item.danger {
            color: var(--md-error);
        }
        .msg-context-menu .menu-item svg {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }
        /* 新增：回复预览栏 */
        .reply-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--md-surface-2dp);
            padding: 6px 12px;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-left: 3px solid var(--md-primary);
            margin: 0 0 2px 0;
            font-size: 0.8125rem;
            color: var(--md-on-surface-muted);
        }
        .reply-preview .reply-content {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .reply-preview .reply-cancel {
            background: none;
            border: none;
            color: var(--md-on-surface-dim);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
        }
        .msg-row .bubble .reply-badge {
            font-size: 0.75rem;
            color: var(--md-on-surface-dim);
            background: var(--md-surface-1dp);
            padding: 2px 8px;
            border-radius: 8px;
            margin-bottom: 4px;
            display: inline-block;
        }
        .msg-row.own .bubble .reply-badge {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }
        /* 个人信息模态框 */
        .profile-modal .md-dialog {
            max-width: 360px;
        }
        .profile-modal .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin: 0 auto 12px;
        }
        .profile-modal .profile-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 16px 0;
        }
        .profile-modal .profile-info .item {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--md-outline);
            padding: 4px 0;
        }
        .profile-modal .profile-info .item .label {
            color: var(--md-on-surface-dim);
        }
        .profile-modal .profile-info .item .value {
            color: var(--md-on-surface);
        }
        .profile-modal .ban-btn {
            background: var(--md-error);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 24px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .profile-modal .ban-btn:active {
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .app {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
                box-shadow: none;
            }
            .global-loading {
                border-radius: 0;
            }
            .user-menu-overlay {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app">

        <div id="globalLoading" class="global-loading">
            <div class="md-progress"></div>
            <div class="loading-text">登录中…</div>
            <div class="loading-sub">正在连接 MJChat</div>
        </div>

        <div class="app-bar" id="appBar" style="display:none;">
            <div class="title-block"><div class="title">MJChat</div></div>
            <div class="online-indicator"><div class="dot"></div><span id="onlineCount">0</span></div>
            <div class="conn-indicator"><div class="dot" id="connDot"></div><span id="connText">离线</span></div>
            <button class="icon-button" id="menuBtn" onclick="toggleUserMenu()" title="菜单">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
        </div>

        <div class="user-menu-overlay" id="userMenuOverlay" onclick="closeUserMenu(event)">
            <div class="user-menu-card" onclick="event.stopPropagation()">
                <div class="user-info">
                    <div class="user-avatar" id="menuUserAvatar">U</div>
                    <div class="user-name" id="menuUserName">用户</div>
                </div>
                <ul class="menu-list">
                    <li id="adminMenuItem" class="admin-item" style="display:none;" onclick="showAdminDialog()">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1C5.925 1 1 5.925 1 12s4.925 11 11 11 11-4.925 11-11S18.075 1 12 1zm0 20c-4.963 0-9-4.037-9-9s4.037-9 9-9 9 4.037 9 9-4.037 9-9 9zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                        管理员功能
                    </li>
                    <li class="logout-item" onclick="logout()">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        退出登录
                    </li>
                </ul>
            </div>
        </div>

        <div class="users-strip" id="usersStrip" style="display:none;">
            <span class="label">在线</span>
            <div id="userChips" style="display:flex;gap:6px;overflow-x:auto;"></div>
        </div>

        <div class="auth-screen" id="loginScreen">
            <div class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></div>
            <h1>登录</h1>
            <div class="auth-form">
                <div class="auth-error" id="loginError"></div>
                <div class="md-text-field"><input type="text" id="loginUsername" placeholder=" " onkeypress="if(event.key==='Enter')doLogin()"><label>用户名</label></div>
                <div class="md-text-field"><input type="password" id="loginPassword" placeholder=" " onkeypress="if(event.key==='Enter')doLogin()"><label>密码</label></div>
                <button class="md-button contained ripple" onclick="doLogin()">登录</button>
            </div>
            <div class="auth-switch">还没有账号？<a onclick="showRegister()">注册</a></div>
        </div>

        <div class="auth-screen hidden" id="registerScreen">
            <div class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-1V8H4v3H1v2h3v3h2v-3h3v-2H6zm9 3c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4z"/></svg></div>
            <h1>注册</h1>
            <div class="auth-form">
                <div class="auth-error" id="regError"></div>
                <div class="auth-success" id="regSuccess"></div>
                <div class="md-text-field"><input type="text" id="regUsername" placeholder=" " maxlength="20"><label>用户名</label></div>
                <div class="md-text-field"><input type="password" id="regPassword" placeholder=" "><label>密码</label></div>
                <div class="md-text-field"><input type="password" id="regPassword2" placeholder=" "><label>确认密码</label></div>
                <button class="md-button contained ripple" onclick="doRegister()">注册</button>
            </div>
            <div class="auth-switch">已有账号？<a onclick="showLogin()">登录</a></div>
        </div>

        <!-- 消息区域 -->
        <div class="messages hidden" id="messagesEl"><div class="loading-state" id="loadingEl"><div class="md-progress"></div>加载中...</div></div>

        <!-- 回复预览栏（放在输入框上方） -->
        <div id="replyPreview" style="display:none; padding:4px 16px 0; background:var(--md-surface-4dp);">
            <div class="reply-preview">
                <span class="reply-content" id="replyPreviewContent">回复 @xxx：内容</span>
                <button class="reply-cancel" onclick="cancelReply()">✕</button>
            </div>
        </div>

        <div class="chat-bar hidden" id="chatBar">
            <button class="more-btn" id="moreBtn" onclick="toggleFeaturePanel()" title="更多"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
            <div class="input-container">
                <textarea class="msg-input" id="msgInput" placeholder="发送消息..." rows="1" maxlength="500" oninput="autoResize(this);toggleSendBtn()" onkeydown="handleKeyDown(event)" onfocus="onInputFocus()"></textarea>
            </div>
            <button class="fab-send" id="sendBtn" onclick="sendMsg()" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>

        <div class="feature-panel" id="featurePanel">
            <div id="featurePanelMain">
                <div class="feature-grid">
                    <div class="feature-item" onclick="openImagePicker()">
                        <div class="feature-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
                        <span class="feature-label">图片</span>
                    </div>
                    <div class="feature-item" onclick="openLinkDialog()">
                        <div class="feature-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></div>
                        <span class="feature-label">链接</span>
                    </div>
                    <div class="feature-item" onclick="openFilePicker()">
                        <div class="feature-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>

        // ===================== 安全过滤（已修复） =====================
        function cleanHtml(html) {
            if (!html) return '';
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const body = doc.body;
            const allowedTags = ['b', 'i', 'u', 's', 'a', 'img', 'span', 'div', 'br', 'svg', 'path', 'audio', 'source',
                'button'
            ];
            const allowedAttrs = {
                'a': ['href', 'target', 'rel'],
                'img': ['src', 'alt', 'width', 'height'],
                'audio': ['src', 'controls'],
                'source': ['src', 'type'],
                'button': ['type']
            };

            function cleanNode(node) {
                if (node.nodeType === Node.TEXT_NODE) return node.cloneNode(true);
                if (node.nodeType !== Node.ELEMENT_NODE) return null;
                const tag = node.tagName.toLowerCase();
                if (!allowedTags.includes(tag)) return null;
                const newNode = document.createElement(tag);
                const allowed = allowedAttrs[tag] || [];
                for (const attr of allowed) {
                    if (node.hasAttribute(attr)) {
                        const val = node.getAttribute(attr);
                        if ((attr === 'href' || attr === 'src') && val.toLowerCase().startsWith('javascript:'))
                            continue;
                        if (attr === 'href' && !val.match(/^(https?:|mailto:|tel:|#|\/)/i)) continue;
                        newNode.setAttribute(attr, val);
                    }
                }
                for (const child of node.childNodes) {
                    const cleanChild = cleanNode(child);
                    if (cleanChild) newNode.appendChild(cleanChild);
                }
                return newNode;
            }

            // 关键修复：遍历 body 的子节点，而不是检查 body 本身
            let result = '';
            for (const child of body.childNodes) {
                const cleanChild = cleanNode(child);
                if (cleanChild) {
                    result += cleanChild.outerHTML || cleanChild.textContent || '';
                }
            }
            return result;
        }

        // ===================== 密码哈希 =====================
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(SALT + password + SALT);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function showLogin() {

        async function doRegister() {
            hideEl('regError');
            hideEl('regSuccess');
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            if (!username) return showEl('regError', '请输入用户名');
            if (username.length < 2) return showEl('regError', '用户名至少 2 个字符');
            if (username.length > 20) return showEl('regError', '用户名最多 20 个字符');
            for (const word of FORBIDDEN_WORDS) {
                if (username.includes(word)) {
                    return showEl('regError', '存在敏感词，请更换用户名');
                }
            }
            if (password.length < 6) return showEl('regError', '密码至少 6 个字符');
            if (password !== password2) return showEl('regError', '两次密码不一致');
            try {
                const { data: existing } = await sb.from(TABLE_USERS).select('username').eq('username', username)
                    .maybeSingle();
                if (existing) return showEl('regError', '该用户名已被使用');
                const passwordHash = await hashPassword(password);
                const { error } = await sb.from(TABLE_USERS).insert({
                    username: username,
                    password_hash: passwordHash,
                    role: 'user',
                    banned: false
                });
                if (error) {
                    if (error.message.includes('duplicate') || error.message.includes('unique')) return showEl(
                        'regError', '该用户名已被使用');
                    return showEl('regError', '注册失败: ' + error.message);
                }
                currentUser = username;
                isAdmin = ADMIN_USERS.includes(currentUser);
                localStorage.setItem('mjchat_session', JSON.stringify({ username: username }));
                showEl('regSuccess', '注册成功！正在进入聊天...');
                recordUserIP(username);
                setTimeout(() => {
                    clearRegForm();
                    showGlobalLoading('登录中…', '欢迎 ' + currentUser);
                    enterChat();
                }, 1200);
            } catch (e) {
                showEl('regError', '注册失败，请重试');
            }
        }

        function clearRegForm() {
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPassword2').value = '';
        }

        async function doLogin() {
            hideEl('loginError');
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username) return showEl('loginError', '请输入用户名');
            if (!password) return showEl('loginError', '请输入密码');
            showGlobalLoading('登录中…', '验证身份中');
            try {
                const passwordHash = await hashPassword(password);
                const { data, error } = await sb.from(TABLE_USERS).select('username, password_hash, banned, role')
                    .eq('username', username).maybeSingle();
                if (error) {
                    hideGlobalLoading();
                    return showEl('loginError', '登录失败: ' + error.message);
                }
                if (!data) {
                    hideGlobalLoading();
                    return showEl('loginError', '用户名不存在');
                }
                if (data.password_hash !== passwordHash) {
                    hideGlobalLoading();
                    return showEl('loginError', '密码错误');
                }
                if (data.banned) {
                    hideGlobalLoading();
                    return showEl('loginError', '您已被封禁，无法登录');
                }
                currentUser = username;
                isAdmin = (data.role === 'admin') || ADMIN_USERS.includes(username);
                localStorage.setItem('mjchat_session', JSON.stringify({ username: username }));
                document.getElementById('loginPassword').value = '';
                updateLoadingText('登录中…', '欢迎 ' + currentUser);
                recordUserIP(username);
                enterChat();
            } catch (e) {
                hideGlobalLoading();
                showEl('loginError', '登录失败，请重试');

        // ===================== 连接与消息订阅 =====================
        function connect() {
            return new Promise((resolve, reject) => {
                let resolved = false;
                loadHistoryInternal()
                    .then(() => {
                        checkUnsupportedMessages();
                        channel = sb.channel(CHANNEL_NAME, { config: { presence: { key: clientId } } });
                        channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE_MSG },
                            p => handleNewMessage(p.new));
                        channel.on('broadcast', { event: 'clear_messages' }, () => handleMessagesCleared());
                        channel.on('broadcast', { event: 'delete_message' }, p => handleMessageDeleted(p
                            .payload.id));
                        channel.on('broadcast', { event: 'user_banned' }, (p) => {
                            if (p.payload.username === currentUser) {
                                showSnackbar('您已被管理员封禁，即将下线');
                                setTimeout(() => logout(), 2000);
                            }
                        });
                        channel
                            .on('presence', { event: 'sync' }, () => {
                                onlineUsers = channel.presenceState();
                                renderOnlineUsers();
                            })
                            .on('presence', { event: 'join' }, ({ newPresences }) => {
                                const n = newPresences[0]?.name;
                                if (n && n !== currentUser) addSystemMsg(`${n} 加入了MJChat`);
                            })
                            .on('presence', { event: 'leave' }, ({ leftPresences }) => {
                                const n = leftPresences[0]?.name;
                                if (n && n !== currentUser) addSystemMsg(`${n} 离开了MJChat`);
                            })
                            .subscribe(async (status) => {
                                if (status === 'SUBSCRIBED') {
                                    updateConn(true);
                                    await channel.track({ name: currentUser, online_at: new Date()
                                            .toISOString() });
                                    if (!resolved) {
                                        resolved = true;
                                        resolve();
                                    }
                                } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
                                    updateConn(false);
                                    if (!resolved) {
                                        resolved = true;
                                        reject(new Error('频道订阅失败'));
                                    }
                                }
                            });
                        setTimeout(() => {
                            if (!resolved) {
                                resolved = true;
                                reject(new Error('连接超时，请检查网络'));
                            }
                        }, 15000);
                    })
                    .catch(err => {
                        if (!resolved) {
                            resolved = true;
                            reject(err);
                        }
                    });
            });
        }

        function loadHistoryInternal() {
            return new Promise((resolve) => {
                loadHistory().then(resolve).catch(() => resolve());

        function checkUnsupportedMessages() {
            const unsupported = allMessages.filter(m => !isVersionSupported(m.msg_version));
            if (unsupported.length > 0) {

            }

        async function loadHistory() {
            try {
                let result = await sb.from(TABLE_MSG).select(
                        'id, sender, text, image_url, audio_url, audio_dur, msg_version, created_at, reply_to_id, reply_content'
                        )
                    .order('created_at', { ascending: false }).limit(HISTORY_LIMIT);
                if (result.error && result.error.message && result.error.message.includes('reply_to_id')) {
                    result = await sb.from(TABLE_MSG).select(
                            'id, sender, text, image_url, audio_url, audio_dur, msg_version, created_at')
                        .order('created_at', { ascending: false }).limit(HISTORY_LIMIT);
                }
                if (result.error && result.error.message && result.error.message.includes('msg_version')) {
                    result = await sb.from(TABLE_MSG).select(
                            'id, sender, text, image_url, audio_url, audio_dur, created_at')
                        .order('created_at', { ascending: false }).limit(HISTORY_LIMIT);
                }
                if (result.error && result.error.message && result.error.message.includes('audio_url')) {
                    result = await sb.from(TABLE_MSG).select('id, sender, text, image_url, msg_version, created_at')
                        .order('created_at', { ascending: false }).limit(HISTORY_LIMIT);
                }
                if (result.error && result.error.message && result.error.message.includes('msg_version')) {
                    result = await sb.from(TABLE_MSG).select('id, sender, text, image_url, created_at')
                        .order('created_at', { ascending: false }).limit(HISTORY_LIMIT);
                }
                if (result.error && result.error.message && result.error.message.includes('image_url')) {
                    result = await sb.from(TABLE_MSG).select('id, sender, text, created_at')
                        .order('created_at', { ascending: false }).limit(HISTORY_LIMIT);
                }
                const { data, error } = result;
                const el = document.getElementById('loadingEl');
                if (el) el.remove();
                if (error) {
                    console.error('loadHistory error:', error);
                    addSystemMsg('无法加载历史消息');
                    return;
                }
                if (!data || data.length === 0) {
                    return;
                }
                data.reverse().forEach(m => handleNewMessage(m, true));
            } catch (e) {
                console.error('loadHistory exception:', e);
                const l = document.getElementById('loadingEl');
                if (l) l.innerHTML = '加载失败';
            }
        }

        // ===================== 消息处理 =====================
        function handleNewMessage(msg, isHistory = false) {
            if (allMessages.some(m => m.id === msg.id)) return;
            const nm = {
                id: msg.id,
                sender: msg.sender,
                text: msg.text || '',
                image_url: msg.image_url || null,
                audio_url: msg.audio_url || null,
                audio_dur: msg.audio_dur || 0,
                msg_version: msg.msg_version || null,
                created_at: msg.created_at,
                reply_to_id: msg.reply_to_id || null,
                reply_content: msg.reply_content || null
            };
            allMessages.push(nm);
            const e = document.getElementById('emptyState');
            if (e) e.remove();
            renderMessage(nm);
            if (!isHistory) scrollToBottom();
        }

        function renderMessage(msg) {
            const c = document.getElementById('messagesEl');
            const isOwn = msg.sender === currentUser;
            const date = new Date(msg.created_at);
            const dl = date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
            if (dl !== lastDateLabel) {
                lastDateLabel = dl;
                const s = document.createElement('div');
                s.className = 'date-divider';
                s.innerHTML = `<span>${dl}</span>`;
                c.appendChild(s);
            }
            const time = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const ci = hashStr(msg.sender) % 8;
            let bubbleContent = '';
            let msgType = 'text';
            let linkUrl = null;
            let imageUrl = null;

            let replyHtml = '';
            if (msg.reply_to_id && msg.reply_content) {
                const repliedSender = msg.reply_content.match(/回复 @([^：]+)：/);
                const displayName = repliedSender ? repliedSender[1] : '用户';
                replyHtml =
                    `<div class="reply-badge">↩ 回复 @${escapeHtml(displayName)}：${escapeHtml(msg.reply_content.replace(/回复 @[^：]+：/, ''))}</div>`;
            }

            if (!isVersionSupported(msg.msg_version)) {
                bubbleContent =
                    `<div style="display:flex;align-items:center;gap:6px;opacity:0.6;font-style:italic;font-size:0.8125rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-2h2v2h-2zm0-10v6h2V7h-2z"/></svg>MJChat的版本过低，请升级到最新版本</div>`;
                msgType = 'unsupported';
            } else {
                if (!msg.audio_url && msg.text && msg.text.indexOf('<audio') !== -1) {
                    const srcMatch = msg.text.match(/<source\s+src="([^"]+)"/i);
                    const durMatch = msg.text.match(/语音消息\s+(\d+):(\d+)/);
                    if (srcMatch) {
                        msg.audio_url = srcMatch[1];
                        msg.audio_dur = durMatch ? parseInt(durMatch[1]) * 60 + parseInt(durMatch[2]) : 0;
                    }
                }
                if (!msg.audio_url && !msg.image_url && msg.text) {
                    var markedVI = parseMarkedText(msg.text);
                    if (markedVI) {
                        if (markedVI.type === 'voice' && markedVI.url) {
                            msg.audio_url = markedVI.url;
                            msg.audio_dur = markedVI.duration;
                        } else if (markedVI.type === 'image' && markedVI.url) {
                            msg.image_url = markedVI.url;
                        }
                    }
                }

                if (msg.audio_url) {
                    const dur = msg.audio_dur || 0;
                    const mins = String(Math.floor(dur / 60)).padStart(2, '0');
                    const secs = String(dur % 60).padStart(2, '0');
                    const durStr = `${mins}:${secs}`;
                    const waveBars = Array.from({ length: 12 }, () => Math.floor(Math.random() * 16 + 4)).map(h =>
                        `<div class="voice-wave" style="height:${h}px"></div>`).join('');
                    bubbleContent = `<div class="voice-msg-wrap" data-audio="${escapeAttr(msg.audio_url)}" data-dur="${dur}" onclick="toggleVoicePlay(this, event)"><button class="voice-play-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><div class="voice-waves">${waveBars}</div><span class="voice-dur">${durStr}</span></div>`;
                    msgType = 'voice';
                } else if (msg.image_url) {
                    imageUrl = msg.image_url;
                    bubbleContent =
                        `<img src="${escapeAttr(msg.image_url)}" onclick="previewImage('${escapeAttr(msg.image_url)}')" alt="图片" draggable="false">`;
                    if (msg.text && !msg.text.startsWith('🖼️ 图片消息')) {
                        bubbleContent += `<div style="margin-top:6px;">${sanitizeHtml(msg.text)}</div>`;
                    }
                    msgType = 'image';
                } else {
                    const marked = parseMarkedText(msg.text);
                    if (marked && marked.type === 'link') {
                        linkUrl = marked.url;
                        bubbleContent =
                            `<a href="${escapeAttr(marked.url)}" target="_blank" rel="noopener noreferrer" style="color:#64B5F6;text-decoration:underline;word-break:break-all;">${escapeHtml(marked.displayText)}</a>`;
                        msgType = 'link';
                    } else if (marked && marked.type === 'file') {
                        const iconPath = getFileIconSvg(marked.fileInfo);
                        bubbleContent =
                            `<a href="${escapeAttr(marked.url)}" target="_blank" rel="noopener noreferrer" class="file-msg"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">${iconPath}</svg><span class="file-info"><b>${escapeHtml(marked.fileInfo)}</b></span></a>`;
                        msgType = 'file';
                        linkUrl = marked.url;
                    } else {
                        // 普通文本：用 cleanHtml 过滤后，再处理 @
                        let cleaned = cleanHtml(msg.text);
                        cleaned = cleaned.replace(/@([\w\u4e00-\u9fa5]+)/g, '<b>@$1</b>');
                        bubbleContent = cleaned;
                        msgType = 'text';
                    }
                }
            }

            const row = document.createElement('div');
            row.className = `msg-row ${isOwn ? 'own' : ''}`;
            row.dataset.msgId = msg.id;
            row.dataset.msgSender = msg.sender;
            row.dataset.msgText = msg.text || '';
            row.dataset.msgVersion = msg.msg_version || '';
            row.dataset.msgType = msgType;
            row.dataset.linkUrl = linkUrl || '';
            row.dataset.imageUrl = imageUrl || '';
            row.dataset.replyToId = msg.reply_to_id || '';
            row.dataset.replyContent = msg.reply_content || '';

            row.innerHTML =
                `<div class="avatar av-${ci}" data-sender="${msg.sender}" data-username="${msg.sender}">${escapeHtml(msg.sender.charAt(0).toUpperCase())}</div><div class="content"><div class="meta"><span class="sender">${escapeHtml(msg.sender)}</span><span class="time">${time}</span></div><div class="bubble ${(msg.image_url && (!msg.text || msg.text.startsWith('🖼️ 图片消息'))) ? 'img-only' : ''}">${replyHtml}${bubbleContent}</div></div>`;
            c.appendChild(row);
        }

            if (!text) return '';
            return cleanHtml(text);

            const c = document.getElementById('messagesEl');

        async function sendMsg() {
            const input = document.getElementById('msgInput');

                    showSnackbar('消息包含不安全内容，已过滤');
                    return;
                }
            }
            document.getElementById('sendBtn').disabled = true;
            const payload = {
                sender: currentUser,

            };
            if (replyTarget) {
                payload.reply_to_id = replyTarget.id;
                payload.reply_content = `回复 @${replyTarget.sender}：${replyTarget.content}`;
            }
            const { error } = await safeInsertMsg(payload);
            if (error) {
                addSystemMsg('发送失败');
                document.getElementById('sendBtn').disabled = false;
                return;
            }
            input.value = '';
            autoResize(input);
            cancelReply();
            toggleSendBtn();
        }

        async function safeInsertMsg(payload) {
            const enriched = { ...payload, msg_version: APP_VERSION };
            let { data, error } = await sb.from(TABLE_MSG).insert(enriched).select('id');
            if (error && error.message && (error.message.includes('reply_to_id') || error.message.includes(
                    'reply_content'))) {
                delete enriched.reply_to_id;
                delete enriched.reply_content;
                const res = await sb.from(TABLE_MSG).insert(enriched).select('id');
                data = res.data;
                error = res.error;
            }
            if (error && error.message && error.message.includes('msg_version')) {
                delete enriched.msg_version;
                const res = await sb.from(TABLE_MSG).insert(enriched).select('id');
                data = res.data;
                error = res.error;
            }
            return { data, error };
        }

        // ===================== 解析标记文本 =====================
        const SEP = ' → ';
        const EMOJI_LINK = '🔗';
        const EMOJI_FILE = '📎';
        const EMOJI_VOICE = '📱';
        const EMOJI_IMAGE = '🖼️';

        function parseMarkedText(text) {
            if (!text) return null;
            var linkPrefix = EMOJI_LINK + ' ';
            var filePrefix = EMOJI_FILE + ' ';
            var voicePrefix = EMOJI_VOICE + ' 语音消息 ';
            var imagePrefix = EMOJI_IMAGE + ' 图片消息';
            if (text.startsWith(linkPrefix) && text.includes(SEP)) {
                var rest = text.substring(linkPrefix.length);
                var sep = rest.indexOf(SEP);
                if (sep > 0) return { type: 'link', displayText: rest.substring(0, sep), url: rest.substring(sep + SEP
                        .length) };
            }
            if (text.startsWith(filePrefix) && text.includes(SEP)) {
                var rest = text.substring(filePrefix.length);
                var sep = rest.indexOf(SEP);
                if (sep > 0) return { type: 'file', fileInfo: rest.substring(0, sep), url: rest.substring(sep + SEP
                        .length) };
            }
            if (text.startsWith(voicePrefix) && text.includes(SEP)) {
                var rest = text.substring(voicePrefix.length);
                var sep = rest.indexOf(SEP);
                if (sep > 0) {
                    var durStr = rest.substring(0, sep).trim();
                    var after = rest.substring(sep + SEP.length).trim();
                    var parts = durStr.split(':');
                    var duration = (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);
                    var url = after.startsWith('http') ? after : null;
                    return { type: 'voice', duration: duration, url: url };
                }
            }
            if (text.startsWith(imagePrefix) && text.includes(SEP)) {
                var rest = text.substring(imagePrefix.length);
                var sep = rest.indexOf(SEP);
                if (sep >= 0) {
                    var after = rest.substring(sep + SEP.length).trim();
                    var url = after.startsWith('http') ? after : null;
                    return { type: 'image', url: url };
                }
            }
            return null;
        }

        function getFileIconSvg(filename) {
            const ext = (filename.split('.').pop() || '').toLowerCase();
            const FILE_ICONS = {
                audio: '<path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm-1 13h-2v3.5c0 1.38-1.12 2.5-2.5 2.5S6 19.88 6 18.5s1.12-2.5 2.5-2.5c.42 0 .8.11 1.14.29V11h3.36v4z"/>',
                video: '<path d="M4 6.47L5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4z"/>',
                archive: '<path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/>',
                image: '<path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>',
                document: '<path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>',
                code: '<path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>',
                default: '<path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>'
            };
            const FILE_EXT_MAP = {
                audio: ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac', 'wma', 'opus'],
                video: ['mp4', 'avi', 'mov', 'mkv', 'webm', 'flv', 'wmv', 'm4v', '3gp', 'mpeg', 'mpg'],
                archive: ['zip', 'rar', '7z', 'tar', 'gz', 'bz2', 'xz', 'iso'],
                image: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg', 'ico', 'tiff', 'psd'],
                document: ['pdf', 'doc', 'docx', 'txt', 'rtf', 'xls', 'xlsx', 'ppt', 'pptx', 'csv', 'odt', 'ods',
                    'odp'
                ],
                code: ['js', 'html', 'css', 'py', 'java', 'cpp', 'c', 'h', 'json', 'xml', 'php', 'rb', 'go', 'rs',
                    'ts', 'jsx', 'tsx', 'vue', 'sh', 'bat', 'sql', 'yml', 'yaml', 'toml', 'ini', 'md'
                ]
            };
            for (const [type, exts] of Object.entries(FILE_EXT_MAP)) {
                if (exts.includes(ext)) return FILE_ICONS[type];
            }
            return FILE_ICONS.default;
        }

            if (!file.type.startsWith('image/')) { showSnackbar('请选择图片文件'); return; }

            try {

                        '上传失败: 请先在 Storage 创建 chat-images Bucket');
                    else showSnackbar('上传失败: ' + error.message);

                const { data: urlData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
                const { error: ie } = await safeInsertMsg({ sender: currentUser, text: buildImageFallback(),
                    image_url: urlData.publicUrl });

                    if (ie2) showSnackbar('发送图片失败: ' + ie2.message);
                } else if (ie) showSnackbar('发送图片失败: ' + ie.message);
            } catch (e) { showSnackbar('上传失败'); }
        }

        function compressImage(file, maxSize, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width,
                            h = img.height;
                        if (w > maxSize || h > maxSize) {
                            if (w > h) { h = h * maxSize / w;
                                w = maxSize; } else { w = w * maxSize / h;
                                h = maxSize; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
